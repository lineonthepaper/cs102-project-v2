# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-here}
jwt.expiration=3600

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Supabase Admin API
supabase.api.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
# Frontend URL for CORS
app.frontend.url=http://localhost:5173

# SpringDoc OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Face recognition strict matching (tunable)
# Global cosine similarity threshold (balanced default)
face.similarityThreshold=0.985
# Each reference image must exceed this to count as a hit
face.perImageThreshold=0.82
# Require at least this many reference images for the best identity to exceed per-image threshold
face.minHitsRequired=1
# If only one reference image exists for an identity, require this higher threshold
face.singleImageStrictThreshold=0.90
# Best identity must exceed runner-up by at least this cosine margin
face.top2Margin=0.02

# Voting-based selection (multi-scan)
face.voting.windowSize=25
face.voting.requiredVotes=25
