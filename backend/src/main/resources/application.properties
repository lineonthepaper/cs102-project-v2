# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-here}
jwt.expiration=3600

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Supabase Admin API
supabase.api.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
# Frontend URL for CORS
app.frontend.url=http://localhost:5173

# SpringDoc OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Face recognition settings - simplified and balanced
# Main threshold for matching (cosine similarity: 0.0-1.0, higher = stricter)
face.similarityThreshold=0.55
# Each reference image must exceed this to count as a valid hit
face.perImageThreshold=0.50
# Minimum number of reference images that must match
face.minHitsRequired=1
# Stricter threshold if student has only one reference image
face.singleImageStrictThreshold=0.58
# Best match must exceed runner-up by this margin to avoid confusion
face.top2Margin=0.05

# Voting system - simplified (collect frames until decision)
# Number of frames to collect before making a decision
face.voting.windowSize=10
# Minimum votes needed for a candidate to be accepted
face.voting.requiredVotes=6
# Minimum similarity per frame to count as a vote
face.voting.minSimilarity=0.52
# Reserved for future use
face.voting.minMargin=0.00
face.voting.mode=votes
